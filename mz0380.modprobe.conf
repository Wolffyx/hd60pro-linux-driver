#
# Installed as /etc/modprobe.d/mz0380.conf by `make install` / `make dkms-install`.
#
# The driver's built-in defaults are the validated capture configuration, so
# this file deliberately sets NOTHING: the card works with a plain
# `modprobe mz0380`, and an option set here would silently diverge from the
# module's own defaults the moment those change.
#
# It documents the few knobs worth knowing, commented out; `modinfo mz0380`
# lists them all. (modprobe pulls in the V4L2/ALSA modules the driver needs from
# its own dependency list - nothing to declare here.)
#

# ---------------------------------------------------------------------------
# HDMI audio (on by default). The driver registers an ALSA capture device
# named after the card: 2 x 16-bit little-endian stereo at 48 kHz. Left/right
# order follows the HDMI/I2S convention (ch0 = left) but has not been checked
# with a hard-panned source. Turn it off for a video-only card:
#
#options mz0380 enable_audio=0

# ---------------------------------------------------------------------------
# Start in H.264 instead of uncompressed YU12 for applications that never pick
# a format themselves (most do).
#
#options mz0380 raw_deliver=0

# ---------------------------------------------------------------------------
# persistent_h264=1 (the default) keeps one card-side encoder alive across
# STREAMOFF/STREAMON. Leave it on: each encoder rebuild is one "spawn", and the
# card wedges somewhere in the 8-18 spawn range per power cycle - recoverable
# only by removing mains power, because slot standby keeps the card alive.
